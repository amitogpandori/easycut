name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Test the desktop app (import, edit, play, export)
        run: npm test

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/output

      - name: Build Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Check the auto-update files
        shell: bash
        run: |
          set -e
          V=$(node -p "require('./package.json').version")
          ls -la dist
          test -f "dist/EasyCut-Setup-$V.exe"
          test -f "dist/EasyCut-Setup-$V.exe.blockmap"
          test -f dist/latest.yml
          cat dist/latest.yml
          grep -q "version: $V" dist/latest.yml
          grep -q "EasyCut-Setup-$V.exe" dist/latest.yml
          # what the installed app reads to find updates: GitHub, this repo, and no publisher (unsigned) check
          cat dist/win-unpacked/resources/app-update.yml
          grep -q "provider: github" dist/win-unpacked/resources/app-update.yml
          grep -q "repo: easycut" dist/win-unpacked/resources/app-update.yml
          if grep -q "publisherName" dist/win-unpacked/resources/app-update.yml; then echo "publisherName would block unsigned updates"; exit 1; fi
          npx --yes @electron/asar list dist/win-unpacked/resources/app.asar > asar-list.txt
          grep "electron-updater" asar-list.txt | grep "package.json"
          echo "auto-update files OK"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EasyCut-Windows-Installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Release notes
        shell: bash
        run: |
          V=${{ steps.ver.outputs.version }}
          {
            if [ -f RELEASE_NOTES.md ]; then cat RELEASE_NOTES.md; echo; echo '---'; echo; fi
            echo "**Windows:** download **EasyCut-Setup-$V.exe** and run it. From 1.16.0 on, EasyCut updates itself: it downloads new versions in the background and installs them when you close it."
            echo 'Windows may say "Windows protected your PC" because the app isn'"'"'t code-signed yet: click **More info → Run anyway**.'
            echo
            echo "**Android:** on your phone, download **EasyCut-$V.apk** (it appears a few minutes after the .exe), open it and tap **Install**. From 1.16.0 on, EasyCut tells you about new versions and installs them from inside the app."
            echo 'The first time, Android asks you to allow installing apps from your browser or Files app: tap **Settings → Allow from this source**, then go back and tap **Install**.'
          } > release-body.md
          cat release-body.md

      - name: Publish release with the installer
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: EasyCut ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: release-body.md
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  android:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the Android app (APK)
        working-directory: mobile
        shell: bash
        run: |
          set -e
          VERSION=$(node -p "require('../package.json').version")
          IFS=. read -r MA MI PA <<< "$VERSION"; CODE=$((MA*10000+MI*100+PA))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          npm install
          rm -rf www && mkdir www && cp -r ../app/* www/
          npx cap add android
          cp -r res/* android/app/src/main/res/
          node patch-android.js
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          # smooth drawing: GPU (hardware) acceleration for the whole app, said explicitly
          sed -i 's#<application#<application android:hardwareAccelerated="true"#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          printf '\nandroid {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n' >> android/app/build.gradle
          npx cap sync android
          grep -n "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          grep -n "VIBRATE" android/app/src/main/AndroidManifest.xml
          grep -n 'hardwareAccelerated="true"' android/app/src/main/AndroidManifest.xml
          grep -n "REQUEST_INSTALL_PACKAGES" android/app/src/main/AndroidManifest.xml
          grep -n "UpdateFileProvider" android/app/src/main/AndroidManifest.xml
          grep -n "registerPlugin(UpdaterPlugin.class)" android/app/src/main/java/com/amitoj/easycut/MainActivity.java
          grep -n "versionCode\|versionName" android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/mobile/easycut-release.keystore" \
            -Pandroid.injected.signing.store.password=easycut-apk-2026 \
            -Pandroid.injected.signing.key.alias=easycut \
            -Pandroid.injected.signing.key.password=easycut-apk-2026
          mkdir -p "$GITHUB_WORKSPACE/dist-android"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist-android/EasyCut-$VERSION.apk"
          ls -la "$GITHUB_WORKSPACE/dist-android"

      - name: Check the APK
        shell: bash
        run: |
          APK=$(ls dist-android/*.apk)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | head -5
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          "$BT/aapt2" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q "REQUEST_INSTALL_PACKAGES" /tmp/perms.txt
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/manifest.txt
          grep "UpdateFileProvider" /tmp/manifest.txt
          unzip -p "$APK" assets/public/updates.js > /tmp/updates.js
          grep -c "EasyCutUpdates" /tmp/updates.js
          echo "in-app updater is in the APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyCut-Android
          path: dist-android/*.apk

      - name: Add the APK to the release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: dist-android/*.apk
