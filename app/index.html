<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>EasyCut — Video Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;800&family=Anton&family=Bebas+Neue&family=Montserrat:wght@500;800&family=Pacifico&family=Permanent+Marker&family=Noto+Sans+Devanagari:wght@500;800&family=Noto+Sans+Gurmukhi:wght@500;800&family=Oswald:wght@500;700&family=Raleway:wght@500;800&family=Playfair+Display:wght@600;800&family=Lobster&family=Dancing+Script:wght@600;700&family=Caveat:wght@600;700&family=Righteous&family=Bangers&family=Satisfy&family=Kaushan+Script&family=Russo+One&family=Archivo+Black&family=Teko:wght@500;700&family=Rajdhani:wght@600;700&family=Abril+Fatface&family=Bungee&family=Shrikhand&family=Monoton&family=Baloo+2:wght@600;800&family=Mukta:wght@500;800&family=Yatra+One&family=Rozha+One&family=Baloo+Paaji+2:wght@600;800&family=Mukta+Mahee:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e13;--panel:#141720;--panel2:#1b1f2b;--panel3:#232838;--line:#262b3a;
  --text:#eceef5;--mut:#8b91a7;--dim:#5d6378;
  --acc:#ff4d6d;--acc2:#ff8a5c;--vid:#3b82f6;--txt:#a855f7;--aud:#10b981;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{display:grid;grid-template-rows:54px minmax(0,1fr) 250px 76px;grid-template-columns:minmax(0,1fr);height:100vh;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.3px}
.logo .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px #ff4d6d55}
.pname{background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 9px;width:220px;color:var(--text)}
.pname:hover{border-color:var(--line)}.pname:focus{outline:none;border-color:var(--acc);background:var(--panel2)}
.sp{flex:1}
.ib{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--mut)}
.ib:hover:not(:disabled){background:var(--panel3);color:var(--text)}
.ib:disabled{opacity:.35;cursor:default}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:9px;background:var(--panel3);font-weight:600}
.btn:hover{filter:brightness(1.15)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 18px #ff4d6d44}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.full{width:100%;justify-content:center}
.btn.danger{color:#ff7b8f}

/* workspace */
.ws{display:grid;grid-template-columns:0 minmax(0,1fr) 300px;min-height:0;transition:grid-template-columns .2s}
body.sheet .ws{grid-template-columns:300px minmax(0,1fr) 300px}
body:not(.sheet) .panel{visibility:hidden;padding:0;border:0}
.rail{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:row;align-items:center;gap:2px;padding:6px 10px;overflow-x:auto;overflow-y:hidden;min-width:0;scrollbar-width:thin}
.tsep{width:1px;align-self:stretch;margin:6px 8px;background:var(--line);flex:none}
.tgrp{font-size:9.5px;font-weight:800;letter-spacing:.6px;color:var(--dim);writing-mode:vertical-rl;transform:rotate(180deg);flex:none;margin-right:2px}
.rail::-webkit-scrollbar{display:none}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:7px 4px;min-width:66px;height:60px;border-radius:12px;color:var(--mut);font-size:11px;font-weight:600;flex:none}
.tab.ct{color:#cfd3e1}
.tab svg.i{width:20px;height:20px}
.tab:hover{color:var(--text);background:var(--panel2)}
.tab.on{color:#fff;background:var(--panel3)}
.tab.on svg{color:var(--acc)}
.panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:0 14px 14px;min-width:0}
.sheet-h{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;background:var(--panel);padding:12px 0 10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.sheet-h b{font-size:15px}
.sheet-h .btn{padding:6px 14px;font-size:15px}
.panel h3,.props h3{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--mut)}
.hint{color:var(--mut);font-size:12.5px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--mut);font-size:12.5px;margin-bottom:12px;cursor:pointer}
.drop:hover{border-color:var(--acc);color:var(--text)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{position:relative;border-radius:10px;overflow:hidden;background:var(--panel2);cursor:pointer;border:1px solid transparent}
.mcard:hover{border-color:var(--acc)}
.mthumb{aspect-ratio:16/10;background:#0a0b0f center/cover no-repeat;display:grid;place-items:center;color:var(--mut)}
.mthumb.aud{background-size:100% 60%;background-color:#0d1a16}
.badge{position:absolute;top:6px;right:6px;background:#000a;padding:1px 6px;border-radius:6px;font-size:11px;font-weight:600}
.tbadge{position:absolute;top:6px;left:6px;background:#000a;padding:1px 6px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase}
.mname{padding:6px 8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.mcard .add{position:absolute;bottom:30px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;opacity:0;transition:.15s}
.mcard:hover .add{opacity:1}
.loading{opacity:.6;pointer-events:none}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preset{background:var(--panel2);border-radius:10px;padding:14px 6px;text-align:center;font-size:17px;line-height:1.15;border:1px solid transparent;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.preset:hover{border-color:var(--acc)}
.egrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.emo{font-size:26px;padding:6px 0;border-radius:8px}
.emo:hover{background:var(--panel3)}
.fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fcard{border-radius:9px;overflow:hidden;background:var(--panel2);border:2px solid transparent;font-size:11px;font-weight:600}
.fcard.on{border-color:var(--acc)}
.fcard div{aspect-ratio:1;background:#222 center/cover}
.fcard span{display:block;padding:4px 0}
.acards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acard{background:var(--panel2);border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;border:2px solid transparent;font-size:12px;font-weight:600}
.acard.on{border-color:var(--acc)}
.acard i{display:block;border:2px solid var(--mut);border-radius:4px}
.acard small{color:var(--mut);font-weight:500}
.sec{margin-bottom:20px}
.vo{display:flex;align-items:center;gap:10px;background:var(--panel2);padding:12px;border-radius:12px}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--acc);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* stage */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;background:radial-gradient(ellipse at center,#161a25 0%,var(--bg) 70%)}
.pv{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px;position:relative}
#cv{position:absolute;background:#000;border-radius:6px;box-shadow:0 10px 40px #0008;touch-action:none}
.empty{position:absolute;inset:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border:2px dashed #2c3245;border-radius:18px;text-align:center;padding:20px;background:#0c0e13cc}
.empty b{font-size:20px}
.empty .hint{max-width:380px}
.transport{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px 12px}
.tc{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mut);min-width:130px}
.tc b{color:var(--text);font-weight:600}
.play{width:46px;height:46px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.play:hover{transform:scale(1.05)}
.play svg.i{width:20px;height:20px}

/* props */
.props{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.phead .dot{width:10px;height:10px;border-radius:3px}
.phead .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.phead small{color:var(--mut)}
.prow{margin-bottom:14px}
.prow>label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:6px}
.rng{display:flex;align-items:center;gap:10px}
.rng input{flex:1}
.rv{min-width:44px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:var(--text)}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:var(--panel3);border-radius:4px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--acc);cursor:pointer}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel2);padding:3px;border-radius:9px}
.seg button{flex:1;padding:6px 6px;border-radius:7px;font-size:12px;font-weight:600;color:var(--mut);white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel3);color:#fff;box-shadow:inset 0 0 0 1px var(--acc)}
.inp,select.inp,textarea.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea.inp{resize:vertical;min-height:64px;user-select:text}
.inp:focus{outline:none;border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0}
.chk input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}
input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:2px;cursor:pointer}
.crow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.acts{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;color:var(--mut)}
.keys kbd{background:var(--panel3);border-radius:5px;padding:1px 7px;color:var(--text);font:600 11.5px "Plus Jakarta Sans";justify-self:start}
.flash{animation:fl 1s}
@keyframes fl{0%,60%{background:#ff4d6d22}}

/* timeline */
.tl{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tlbar{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line)}
.tlbar .btn.sm{background:transparent;color:var(--mut)}
.tlbar .btn.sm:hover{background:var(--panel3);color:var(--text)}
.zoom{display:flex;align-items:center;gap:6px;color:var(--mut)}
.zoom input{width:120px}
.tlbody{flex:1;display:flex;min-height:0;overflow:hidden}
.tllabels{width:86px;flex:none;border-right:1px solid var(--line);padding-top:26px;padding-bottom:40px;overflow:hidden}
.tll{display:flex;align-items:center;gap:6px;padding:0 10px;font-size:11.5px;font-weight:700;color:var(--mut);border-bottom:1px solid #1d2130}
.tll i{width:8px;height:8px;border-radius:2px}
.tlscroll{flex:1;overflow:auto;position:relative;overscroll-behavior:contain}
.tlinner{position:relative;min-height:100%;contain:layout style}
/* smoother taps & drags on touch screens: no double-tap zoom delay, no grey tap flash */
button,.tab,.btn,.item,.junc,.mcard,.preset,.ruler{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.item{touch-action:none}
@keyframes ecSheetUp{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes ecSheetIn{from{transform:translate3d(0,100%,0)}62%{transform:translate3d(0,-1.2%,0)}to{transform:none}}
.sheet-drag{transition:none!important;animation:none!important;will-change:transform}
.sheet-back{transition:transform .42s cubic-bezier(.18,1.35,.4,1)!important}
.sheet-out{transform:translate3d(0,110%,0)!important;transition:transform .19s cubic-bezier(.4,0,1,1)!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;transition-duration:0s!important}}
.ruler{height:26px;position:relative;border-bottom:1px solid var(--line);cursor:ew-resize;background:var(--panel)}
.tick{position:absolute;top:0;height:100%;border-left:1px solid #2e3446}
.tick span{position:absolute;left:4px;top:5px;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.tick.mn{height:6px;top:auto;bottom:0}
.track{position:relative;border-bottom:1px solid #1d2130}
.item{position:absolute;top:5px;border-radius:7px;overflow:hidden;cursor:grab;touch-action:none;border:2px solid transparent}
.item.sel{border-color:#fff;box-shadow:0 0 0 3px #ff4d6d88;z-index:6}
.item .lbl{position:absolute;left:6px;top:4px;right:6px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000;pointer-events:none}
.item .lbl b{background:var(--acc);border-radius:4px;padding:0 4px;margin-right:4px;text-shadow:none}
.vclip{height:54px;background:#20283a repeat-x left center/auto 100%}
.vclip::after{content:"";position:absolute;inset:0;background:linear-gradient(#0006,transparent 45%);pointer-events:none}
.titem{height:24px;background:linear-gradient(135deg,#7c3aed,#a855f7)}
.titem .lbl{top:3px}
.aitem{height:30px;background:#0f3b2f no-repeat;background-color:#0e3a2e}
.oitem{height:30px;background:#5a2a08 repeat-x left center/auto 100%}
.oitem::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#f97316cc,#f9731640);pointer-events:none}
.oitem .lbl{top:7px;z-index:1}
.beats{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(90deg,rgba(255,255,255,.55) 0 1px,transparent 1px);background-repeat:repeat-x}
.eitem{height:24px;background:linear-gradient(135deg,#a16207,#eab308)}
.eitem .lbl{top:3px}
.pro{background:var(--panel2);border-radius:12px;padding:0 12px;margin-bottom:14px;border:1px solid var(--line)}
.pro[open]{padding-bottom:10px}
.pro summary{cursor:pointer;font-weight:700;padding:11px 0;list-style:none}
.pro summary::-webkit-details-marker{display:none}
.pro summary::after{content:'▾';float:right;color:var(--mut)}
.label2{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--dim);text-transform:uppercase;margin:12px 0 8px}
.kfb{width:22px;height:22px;border-radius:6px;font-size:12px;color:var(--dim);background:var(--panel3);display:grid;place-items:center}
.kfb.has{color:#fbbf24}.kfb.on{color:#111;background:#fbbf24}
.kfbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.kfbar .seg{flex:1;min-width:130px}
.kfd{position:absolute;bottom:3px;width:7px;height:7px;margin-left:-3.5px;background:#fbbf24;transform:rotate(45deg);pointer-events:none;z-index:2;box-shadow:0 0 0 1px #000}
.io{position:absolute;top:0;bottom:0;background:#3b82f633;border-left:2px solid #3b82f6;border-right:2px solid #3b82f6;pointer-events:none}
.tmk{position:absolute;top:0;width:10px;height:12px;margin-left:-5px;background:#22c55e;clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%);cursor:pointer;z-index:3}
.ttog{margin-left:auto;font-size:12px;opacity:.75;padding:2px}.ttog.off{opacity:1;filter:grayscale(0)}
.tll{position:relative}
#bSnap.on{background:var(--panel3);color:var(--text)}
#meter{border-radius:3px;margin:0 4px}
.fxpick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.fxpick .chip.on,.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pmwrap{position:relative}
.pmenu{display:none;position:absolute;top:calc(100% + 6px);right:0;min-width:250px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:80;box-shadow:0 12px 32px #0008}
.pmenu.on{display:block}
.pmenu button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;text-align:left;color:var(--text)}
.pmenu button:hover{background:var(--panel2)}.pmenu button:disabled{opacity:.4}
.pmenu kbd{margin-left:auto;font-size:11px;color:var(--dim);font-family:inherit}
.pmenu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.pmenu .lbl{font-size:11px;color:var(--dim);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.5px}
.upgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.upopt{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;color:var(--text);cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit}
.upopt small{color:var(--mut);font-size:11px}.upopt.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--panel2))}.upopt:disabled{opacity:.35;cursor:not-allowed}
.ailog{min-height:120px;max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0}
.aim{padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.45;max-width:94%}
.aim.u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.aim.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.aim ul{margin:6px 0 6px;padding-left:16px;color:var(--mut);font-size:12px}
.aim .btn{margin-top:4px}
#aiIn{resize:none;min-height:44px}
.aichips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:thin}
.aichips .chip{white-space:nowrap;flex:none}
.fxcard{font-size:13px;font-weight:700;padding:12px 4px;white-space:normal}
.desk{display:none!important}
body.is-desk .desk{display:inline-flex!important}
.cropbar{display:flex;gap:6px;margin-top:12px}
.cropbar .btn{flex:1;justify-content:center}
.ovlist{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.busy{position:fixed;inset:0;background:#000a;z-index:95;display:none;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.busy.on{display:flex}
.home{position:fixed;inset:0;z-index:84;background:radial-gradient(ellipse at 30% 0%,#2a1520 0%,var(--bg) 55%);display:none;overflow-y:auto}
.home.on{display:block}
.home-in{max-width:880px;margin:0 auto;padding:48px 24px}
.home-logo{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:800;letter-spacing:-.5px}
.home-logo .mk{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;box-shadow:0 8px 24px #ff4d6d55}
.htiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:30px 0 18px}
.htile{border-radius:20px;padding:22px 16px;text-align:left;color:#fff;display:flex;flex-direction:column;gap:6px;min-height:150px;justify-content:flex-end;transition:transform .15s;box-shadow:0 10px 30px #0006}
.htile:hover{transform:translateY(-3px)}
.htile .em{font-size:34px;margin-bottom:auto}
.htile b{font-size:18px}.htile small{opacity:.85;font-size:12.5px}
.hrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.hrecent{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.hrc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left}
.hrc:hover{border-color:var(--acc)}
.hrc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* overlays */

<body>
<header class="top">
  <button class="ib" id="bHome" title="Home"></button>
  <div class="logo"><div class="mk"><svg class="i f" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>EasyCut</div>
  <input class="pname" id="pname" value="My Vlog" spellcheck="false" aria-label="Project name">
  <div class="sp"></div>
  <button class="btn sm" id="bReel" title="Make a reel automatically from your clips" style="background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff">✨ Reel Maker</button>
  <div class="pmwrap"><button class="btn sm" id="bProj" title="Project menu">📁 Project ▾</button><div class="pmenu" id="pmenu"></div></div>
  <button class="btn sm desk" id="bOpen" title="Open project (Ctrl+O)">Open</button>
  <button class="btn sm desk" id="bSave" title="Save project (Ctrl+S)">Save</button>
  <button class="ib" id="bUndo" title="Undo (Ctrl+Z)" disabled></button>
  <button class="ib" id="bRedo" title="Redo (Ctrl+Y)" disabled></button>
  <button class="btn pri" id="bExport"></button>
</header>

<div class="ws">
  <aside class="panel" id="panel"></aside>
  <section class="stage">
    <div class="pv" id="pv">
      <canvas id="cv" width="1920" height="1080"></canvas>
      <div class="empty" id="empty">
        <div class="logo"><div class="mk" style="width:54px;height:54px;border-radius:16px"><svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg></div></div>
        <b>Start your video</b>
        <div class="hint">Drag videos, photos and music anywhere on this window, or import them. They go straight onto the timeline in order.</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn pri" id="bImportBig">Import media</button><button class="btn" id="bReelBig" style="background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff">✨ Make a reel</button></div>
      </div>
    </div>
    <div class="transport">
      <div class="tc" id="tc"><b>0:00.0</b> / 0:00.0</div>
      <canvas id="meter" width="56" height="14" title="Audio level"></canvas>
      <button class="ib" id="bStart" title="Go to start (Home)"></button>
      <button class="ib" id="bBack" title="Previous frame (←)"></button>
      <button class="play" id="bPlay" title="Play / Pause (Space)"></button>
      <button class="ib" id="bFwd" title="Next frame (→)"></button>
      <button class="ib" id="bEnd" title="Go to end (End)"></button>
      <div style="min-width:130px;display:flex;justify-content:flex-end;gap:6px"><button class="btn sm" id="bShot" title="Save this frame as an image (thumbnail)"></button><button class="btn sm" id="bSplit2" title="Split at playhead (S)"></button></div>
    </div>
  </section>
  <aside class="props" id="props"></aside>
</div>

<section class="tl">
  <div class="tlbar">
    <button class="btn sm" id="tSplit" title="Split (S)"></button>
    <button class="btn sm" id="tDup" title="Duplicate (Ctrl+D)"></button>
    <button class="btn sm" id="tDel" title="Delete (Del)"></button>
    <div class="sp"></div>
    <div class="zoom">
      <button class="ib" id="zOut" title="Zoom out (-)"></button>
      <input type="range" id="zoom" min="0" max="100" value="40" aria-label="Timeline zoom">
      <button class="ib" id="zIn" title="Zoom in (+)"></button>
      <button class="btn sm" id="zFit">Fit</button>
      <button class="btn sm on" id="bSnap" title="Snapping on/off">🧲</button>
      <button class="btn sm" id="bPro" title="Frame step, cuts, markers, in/out">⋯ Pro</button>
    </div>
  </div>
  <div class="tlpro" id="tlPro"></div>
  <div class="tlbody">
    <div class="tllabels" id="tlLabels">
      <div class="tll" id="lV" style="height:65px"><i style="background:var(--vid)"></i>VIDEO</div>
      <div class="tll" id="lO" style="height:41px"><i style="background:#f97316"></i>OVERLAY</div>
      <div class="tll" id="lE" style="height:35px"><i style="background:#eab308"></i>EFFECTS</div>
      <div class="tll" id="lT" style="height:35px"><i style="background:var(--txt)"></i>TEXT</div>
      <div class="tll" id="lA" style="height:41px"><i style="background:var(--aud)"></i>AUDIO</div>
    </div>
    <div class="tlscroll" id="tlScroll">

        <div class="ruler" id="ruler"></div>
        <div class="track" id="trkV" style="height:65px"></div>
        <div class="track" id="trkO" style="height:41px"></div>
        <div class="track" id="trkE" style="height:35px"></div>
        <div class="track" id="trkT" style="height:35px"></div>
        <div class="track" id="trkA" style="height:41px"></div>
        <div class="playhead" id="playhead"></div>
      </div>
    </div>
  </div>
</section>

<nav class="rail" id="rail"></nav>

<div class="modal" id="mExport"><div class="dlg" id="dlgExport"></div></div>
<div class="studio" id="studio"></div>
<div class="home on" id="home"></div>
<div class="toast" id="toast"></div>
<div class="dz" id="dz">Drop to add to your video</div>
<input type="file" id="fileIn" multiple accept="video/*,image/*,audio/*" hidden>

function openSheet(k){ if (k) tab = k; document.body.classList.add('sheet'); renderRail(); renderPanel(); if (tab === 'ai' && AIB) aiRefresh(); if (tab === 'gif' && gif.key && !gif.items.length && !gif.loading) gifLoad('Trending'); }
function closeSheet(){ document.body.classList.remove('sheet'); renderRail(); }
function renderRail(){
  $('#rail').innerHTML = TABS.map(([k, l, i]) => `<button class="tab ${sheetOpen() && tab === k ? 'on' : ''}" data-tab="${k}">${ic(i)}${l}</button>`).join('')
    + `<span class="tsep"></span><span class="tgrp">CLIP</span>` + CLIP_TOOLS.map(([k, l, i]) => `<button class="tab ct" data-ct="${k}" title="${l} the selected clip">${ic(i)}${l}</button>`).join('');
}
function focusSec(id){ const el = $('#' + id); if (!el) return; el.scrollIntoView({ block:'center', behavior:'smooth' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
function clipTool(k){
  if (!sel || sel.type !== 'clip'){ const ca = clipAt(playT); if (!ca) return toast('Add a clip first'); setSel('clip', ca.c.id); }
  const o = getSel(), m = media[o.mediaId];
  if (k === 'split') return split();
  if (k === 'speed'){ if (m.type !== 'video') return toast('Speed works on video clips'); return focusSec('secSpeed'); }
  if (k === 'volume'){ if (m.type !== 'video') return toast('Photos have no sound — add music in the Music tool'); return focusSec('secVol'); }
  if (k === 'crop') return enterBoxMode('crop', o.id);
  if (k === 'trans') return openSheet('transitions');
  if (k === 'freeze') return freezeFrame();
  if (k === 'rotate'){ push(); o.rotate = (o.rotate + 90) % 360; return refreshAll(); }
  if (k === 'flip'){ push(); o.flipH = !o.flipH; return refreshAll(); }
  if (k === 'dup') return dup();
  if (k === 'del') return del();
}
$('#rail').addEventListener('click', e => {
  const ct = e.target.closest('[data-ct]'); if (ct) return clipTool(ct.dataset.ct);
  const b = e.target.closest('[data-tab]'); if (!b) return;
  const k = b.dataset.tab;
  if (k === 'reel') return openReel();
  if (sheetOpen() && tab === k) return closeSheet();
  openSheet(k);
});

function mediaCard(m){

  const th = m.type === 'audio'
    ? `<div class="mthumb aud" style="${m.wave ? `background-image:url('${burl(m.wave)}')` : ''}">${m.wave ? '' : ic('music')}</div>`
    : `<div class="mthumb" style="${m.thumb ? `background-image:url('${burl(m.thumb)}')` : ''}"></div>`;
  return `<div class="mcard ${m.loading ? 'loading' : ''}" draggable="true" data-mid="${m.id}" title="Click to add at the playhead">${th}<span class="tbadge">${m.type}</span><span class="badge">${m.loading ? '…' : dur}</span><div class="mname">${esc(m.name)}</div><div class="add">${ic('plus')}</div></div>`;
}

  if (act === 'exportTpl') return exportMyTemplates();

/* ---------- import ---------- */
function once(el, ev, ms = 15000){
  return new Promise((res, rej) => {
    const ok = () => { cl(); res(); }, bad = () => { cl(); rej(new Error(ev)); };

let variants = null;
async function makeVariants(){
  if (!reel.items.some(it => media[it.mid])) return;
  if (reel.songs.filter(id => media[id]).length > 1 && !reel.songMode){ reel.songMode = 'one'; reel.songAsked = true; }
  const base = reel.seed || 1, st0 = reel.style, ord0 = reel.order;
  progress('Making 3 versions…', 2, 'Looking at your clips'); await analyzeReel((p, n) => progress('Making 3 versions…', 2 + p * 30, 'Looking at ' + n));
  const sug = suggestStyles(reel.items.filter(it => media[it.mid])).map(x => x.id), first = st0 === 'auto' ? (sug[0] || 'beat') : st0;
  const second = sug.find(id => id !== first) || REEL_STYLES.find(s => s.id !== first).id;
  const plan = [{ style:first, seed:base, order:ord0 }, { style:second, seed:base + 7, order:ord0 }, { style:first, seed:base + 13, order:ord0 === 'story' ? 'shuffle' : 'story' }];
  const out = [];
  for (let i = 0; i < plan.length; i++){
    Object.assign(reel, plan[i]); progress('Making 3 versions…', 35 + i * 20, `Version ${'ABC'[i]}`);
    await buildReel({ quiet:true, keepBusy:true, noPush:i > 0 });
    const s = REEL_STYLES.find(x => x.id === reel.style) || REEL_STYLES[0], hero = S.clips.find(c => c.hero) || S.clips[0];
    out.push({ snap:snap(), name:`${s.emoji} ${s.name}`, order:reel.order, n:S.clips.length, len:videoEnd(), thumb:hero && media[hero.mediaId] ? media[hero.mediaId].thumb : '' });
  }
  Object.assign(reel, { style:st0, seed:base, order:ord0 });
  variants = { list:out, cur:0 }; restore(out[0].snap); progressDone(); closeStudio(); refreshAll(); fitZoom(); playT = 0; seekPreview(); renderVariants();
  toast('3 versions ready — tap A, B or C to compare, then Keep', 4500);
}
function renderVariants(){
  let b = $('#varBar'); if (!variants){ if (b) b.remove(); return; }
  if (!b){ b = document.createElement('div'); b.id = 'varBar'; b.className = 'varbar'; document.body.appendChild(b); b.addEventListener('click', e => { const x = e.target.closest('[data-var]'); if (!x) return; const v = x.dataset.var;
    if (v === 'keep'){ variants = null; renderVariants(); markDirtyToast(); return; }
    variants.cur = +v; restore(variants.list[+v].snap); playT = 0; fitZoom(); seekPreview(); renderVariants(); if (!playing) play(); }); }
  b.innerHTML = `<b>Pick a version</b>${variants.list.map((x, i) => `<button class="varbtn ${i === variants.cur ? 'on' : ''}" data-var="${i}"><span class="vth" style="background-image:url('${burl(x.thumb)}')"></span><span><b>${'ABC'[i]} · ${esc(x.name)}</b><small>${x.n} clips · ${fmtLong(x.len)} · ${x.order === 'story' ? '📖 story' : x.order === 'order' ? '➡️ in order' : '🔀 shuffled'}</small></span></button>`).join('')}<button class="btn pri sm" data-var="keep">✓ Keep</button>`;
}

const chCv = document.createElement('canvas'), chCx = chCv.getContext('2d');

function colorPass(filter, k){ const s = snapCanvas(); ctx.save(); ctx.globalAlpha = clamp(k, 0, 1); ctx.filter = filter; ctx.drawImage(s, 0, 0); ctx.restore(); }
function tint(s, col){ const W = cv.width, H = cv.height; if (chCv.width !== W || chCv.height !== H){ chCv.width = W; chCv.height = H; } chCx.globalCompositeOperation = 'source-over'; chCx.drawImage(s, 0, 0); chCx.globalCompositeOperation = 'multiply'; chCx.fillStyle = col; chCx.fillRect(0, 0, W, H); chCx.globalCompositeOperation = 'source-over'; return chCv; }

function grain(alpha, t){ const W = cv.width, H = cv.height, ox = Math.floor(rnd(Math.floor(t * 24), 3) * 256), oy = Math.floor(rnd(Math.floor(t * 24), 4) * 256); ctx.save(); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = 'overlay'; ctx.fillStyle = ctx.createPattern(noiseCv, 'repeat'); ctx.translate(-ox, -oy); ctx.fillRect(ox, oy, W, H); ctx.restore(); }

const CONF = ['#ff4d6d','#facc15','#22d3ee','#a855f7','#22c55e','#f97316','#ffffff'];
const EFFECTS = [
  // Beat: follow the song on the Audio track (120 BPM if there is no song)
  ['Beat','punch','💥 Beat zoom', (t, k) => { const b = beatNow(t); drawScaled(ctx, snapCanvas(), 1 + .14 * k * Math.pow(1 - b.ph, 3)); }],
  ['Beat','beatflash','💡 Beat flash', (t, k) => { const b = beatNow(t); overlayFill('#fff', .55 * k * Math.max(0, 1 - b.ph * b.period / .12)); }],

function tplTokens(t0){
  const ca = clipAt(Math.min(t0 + .05, Math.max(0, videoEnd() - .01))), m = ca && media[ca.c.mediaId], ex = (m && m.exif) || {};
  const it = m && reel.items.find(x => x.mid === m.id), d = new Date((ex.date || (m && m.date)) || Date.now());
  return { camera:[ex.camera, ex.lens].filter(Boolean).join(' · ') || 'Your camera · lens', settings:ex.settings || '600mm · f/6.3 · 1/2000s · ISO 800', place:ex.place || 'Location', date:d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }).toUpperCase(), species:(it && it.caption) || 'Species name' };
}

/* ---------- user storage: your fonts and your templates (kept on this computer) ---------- */
const store = {
  db:null, mem:{ fonts:[], tpl:[], logos:[], luts:[], projects:[] },
  async open(){ if (this.db !== null) return this.db; try { this.db = await new Promise((res, rej) => { const r = indexedDB.open('easycut', 4); r.onupgradeneeded = () => { for (const n of ['fonts','tpl','logos','luts','projects']) if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, { keyPath:'id' }); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); } catch (e) { this.db = false; } return this.db; },
  async all(name){ const db = await this.open(); if (!db) return this.mem[name].slice(); return new Promise(res => { try { const q = db.transaction(name).objectStore(name).getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); } catch (e) { res([]); } }); },
  async put(name, v){ const db = await this.open(); if (!db){ this.mem[name] = this.mem[name].filter(x => x.id !== v.id).concat(v); return; } return new Promise(res => { try { const t = db.transaction(name, 'readwrite'); t.objectStore(name).put(v); t.oncomplete = res; t.onerror = res; } catch (e) { res(); } }); },
  async putStrict(name, v){ const db = await this.open(); if (!db){ this.mem[name] = this.mem[name].filter(x => x.id !== v.id).concat(v); return; } return new Promise((res, rej) => { const t = db.transaction(name, 'readwrite'); t.objectStore(name).put(v); t.oncomplete = () => res(); t.onerror = () => rej(t.error || new Error('could not write')); t.onabort = () => rej(t.error || new Error('quota')); }); },
  async del(name, id){ const db = await this.open(); if (!db){ this.mem[name] = this.mem[name].filter(x => x.id !== id); return; } return new Promise(res => { try { const t = db.transaction(name, 'readwrite'); t.objectStore(name).delete(id); t.oncomplete = res; t.onerror = res; } catch (e) { res(); } }); },
};
let myTemplates = [];
async function registerFont(name, data){ const face = new FontFace(name, data); await face.load(); document.fonts.add(face); if (!userFonts.includes(name)) userFonts.push(name); }
async function loadUserStuff(){
  for (const f of await store.all('fonts')){ try { await registerFont(f.name, f.data); } catch (e) {} }
  myTemplates = await store.all('tpl'); await loadLogos(); await loadLuts();

  const off = AIB.onPullProgress(d => { if (d.model !== model) return; ai.pulling.status = d.status; if (d.total) ai.pulling.pct = d.completed / d.total * 100; const b = document.querySelector('#panel .bar i'); if (b && tab === 'ai'){ b.style.width = ai.pulling.pct.toFixed(1) + '%'; const p2 = b.closest('.vo').querySelector('b:last-child'); if (p2) p2.textContent = Math.round(ai.pulling.pct) + '%'; } });
  try { await AIB.pull(model); ai.model = model; try { localStorage.setItem('easycut.aiModel', model); } catch (e) {} toast(`${model} is ready — ask it to edit your video`); }
  catch (e) { toast('Download failed: ' + e.message, 5000); }
  off(); ai.pulling = null; ai.more = false; await aiRefresh(); renderPanel();
}

/* ---------- Enhance + AI Upscale ---------- */
const ENHANCE = { sharp:45, vib:18, con:8, hi:-12, sh:12, bl:-4 };
const UPB = DESK && DESK.upscale ? DESK.upscale : null;
const up = { height:2160, mode:'anime', busy:false };
function upModal(){ let m = $('#mUp'); if (!m){ m = document.createElement('div'); m.className = 'modal'; m.id = 'mUp'; m.innerHTML = '<div class="dlg" id="dlgUp" style="width:460px"></div>'; document.body.appendChild(m); m.addEventListener('click', upClick); } return m; }
function openUpscale(c){
  const m = media[c.mediaId]; if (!m || m.type !== 'video') return toast('Select a video clip');
  up.clip = c.id; const mm = upModal(), d = $('#dlgUp');
  if (!UPB){ d.innerHTML = `<h2>🔍 AI Upscale</h2><div class="hint" style="margin:8px 0 14px">AI Upscale makes low-resolution videos sharp at 1080p, 2K or 4K using a free AI model on your own graphics card. It works in the <b style="color:var(--text)">EasyCut Windows app</b>.</div><div class="hint">Here you can still: tap <b style="color:var(--text)">✨ Enhance</b> to sharpen a clip, and choose <b style="color:var(--text)">2K or 4K</b> when you export.</div><div class="row"><button class="btn" data-u="close">Close</button></div>`; mm.classList.add('on'); return; }
  const short = Math.min(m.w, m.h) || 720;
  const opt = (k, v, l, sub, dis) => `<button class="upopt ${up[k] === v ? 'on' : ''}" data-uk="${k}" data-uv="${v}" ${dis ? 'disabled' : ''}><b>${l}</b><small>${sub}</small></button>`;
  if (up.height <= short) up.height = [1080, 1440, 2160].find(h => h > short) || 2160;
  d.innerHTML = `<h2>🔍 AI Upscale</h2><div class="hint">${esc(m.name)} · now ${m.w} × ${m.h}. Makes a new, sharper copy of the video and swaps it into your project.</div>
    <h3 style="margin:14px 0 6px;font-size:13px">Make it</h3><div class="upgrid">${opt('height', 1080, '1080p', 'Full HD', short >= 1080)}${opt('height', 1440, '2K', '1440p', short >= 1440)}${opt('height', 2160, '4K', '2160p', short >= 2160)}</div>
    <h3 style="margin:14px 0 6px;font-size:13px">Type of video</h3><div class="upgrid">${opt('mode', 'anime', '🎨 Cartoon / AI video', 'Fast AI · best for animation')}${opt('mode', 'real', '📷 Real camera', 'Strong AI · slower')}${opt('mode', 'quick', '⚡ Quick', 'No AI · seconds')}</div>
    <div class="hint" style="margin-top:12px">${m.duration > 60 ? `⚠️ This clip is ${Math.round(m.duration / 60)} min long — AI upscaling can take a long time. Trim it first, or use Quick.<br>` : ''}The first time, EasyCut downloads the free tools (about 100 MB). Uses your graphics card (Vulkan); if it can't, a standard upscale is used.</div>
    <div class="row"><button class="btn" data-u="close">Cancel</button><button class="btn pri" data-u="go">🔍 Upscale</button></div>`;
  mm.classList.add('on');
}
function upClick(e){
  const o = e.target.closest('[data-uk]'); if (o && !o.disabled){ up[o.dataset.uk] = o.dataset.uk === 'height' ? +o.dataset.uv : o.dataset.uv; const c = getObj('clip', up.clip); if (c) openUpscale(c); return; }
  const u = e.target.closest('[data-u]')?.dataset.u;
  if (u === 'close'){ $('#mUp').classList.remove('on'); }
  else if (u === 'cancel'){ UPB.cancel(); }
  else if (u === 'go') runUpscale();
}
async function runUpscale(){
  const c = getObj('clip', up.clip), m = c && media[c.mediaId]; if (!m || up.busy) return;
  up.busy = true; const d = $('#dlgUp'), t0 = Date.now();
  const STAGES = { setup:'Getting the free tools ready', frames:'Step 1 of 3 · Reading frames', ai:'Step 2 of 3 · AI upscaling', encode:'Step 3 of 3 · Saving', upscale:'Upscaling' };
  const show = p => { d.innerHTML = `<h2>🔍 Upscaling to ${up.height >= 2160 ? '4K' : up.height >= 1440 ? '2K' : '1080p'}</h2><div class="hint">${esc(STAGES[p.stage] || 'Working')}</div><div class="bar" style="margin:12px 0 6px"><i style="width:${(p.pct || 0).toFixed(1)}%"></i></div><div class="crow"><span class="hint">${esc(p.msg || '')}</span><b>${Math.round(p.pct || 0)}%</b></div><div class="row"><button class="btn" data-u="cancel">Cancel</button></div>`; };
  show({ stage:'setup', pct:0, msg:'Starting…' });
  const off = UPB.onProgress(show);
  let r;
  try {
    const opts = { mode:up.mode, height:up.height, name:m.name };
    if (m.path) opts.input = m.path; else opts.data = await (await fetch(m.url)).arrayBuffer();
    r = await UPB.run(opts);
  } catch (e) { r = { ok:false, error:e.message }; }
  off(); up.busy = false;
  if (!r.ok){ if (r.cancelled){ $('#mUp').classList.remove('on'); return toast('Upscale cancelled'); } d.innerHTML = `<h2>Upscale failed</h2><div class="hint" style="margin:8px 0">${esc(r.error || 'Unknown error')}</div><div class="row"><button class="btn" data-u="close">Close</button></div>`; return; }
  d.innerHTML = `<h2>Adding the sharp video…</h2><div class="bar"><i style="width:100%"></i></div>`;
  const buf = await DESK.readFile(r.path), nm = r.path.split(/[\\/]/).pop();
  const nmed = await importOne(new File([buf], nm, { type:'video/mp4' }), undefined, r.path);
  if (!nmed){ d.innerHTML = `<h2>Saved, but could not load it</h2><div class="hint">${esc(r.path)}</div><div class="row"><button class="btn" data-u="close">Close</button></div>`; return; }
  for (let i = 0; i < 100 && nmed.loading; i++) await new Promise(res => setTimeout(res, 100));
  push(); let n = 0; for (const cl of S.clips) if (cl.mediaId === m.id){ cl.mediaId = nmed.id; n++; }
  if (S.res < up.height){ S.res = up.height; applyCanvasSize(); }
  refreshAll(); seekPreview();
  const mins = (Date.now() - t0) / 60000;
  d.innerHTML = `<h2>✅ Done — ${r.width} × ${r.height}</h2><div class="hint" style="margin:8px 0">${r.method === 'ai' ? 'AI upscaled' : 'Upscaled'} from ${esc(r.from)} in ${mins < 1 ? Math.round(mins * 60) + ' s' : mins.toFixed(1) + ' min'}. ${n} clip${n === 1 ? '' : 's'} now use the sharp version, and export is set to ${up.height >= 2160 ? '4K' : up.height >= 1440 ? '2K' : '1080p'}.</div>${r.note ? `<div class="hint" style="color:#fbbf24;margin-bottom:8px">${esc(r.note)}</div>` : ''}<div class="hint">Also saved as: ${esc(r.path)}</div><div class="row"><button class="btn" data-u="folder">Show file</button><button class="btn pri" data-u="close">OK</button></div>`;
  d.querySelector('[data-u="folder"]').onclick = () => DESK.showInFolder(r.path);
}

/* ---------- Optimize: edit-friendly copies of heavy phone videos (4K, HDR, HEVC, 60 fps) ---------- */
const opt = { q:[], t:null };
const optPref = () => { try { return localStorage.getItem('easycut.optimize') || 'ask'; } catch (e) { return 'ask'; } };
function heavyUsed(){ const ids = new Set([...S.clips.map(c => c.mediaId), ...S.overlays.map(o => o.mediaId)]); return Object.values(media).filter(m => heavy(m) && !m.replacedBy && (ids.has(m.id) || !S.clips.length)); }
function heavy(m){ return m.type === 'video' && !m.optimized && (Math.min(m.w, m.h) > 1080 || /\.(mov|hevc|mkv|m4v)$/i.test(m.name)); }
function optCheck(m){
  if (!UPB || !UPB.optimize || !heavy(m) || optPref() === 'never') return;
  opt.q.push(m); clearTimeout(opt.t); opt.t = setTimeout(() => { const list = opt.q.splice(0); if (optPref() === 'always') runOptimize(list); else optAsk(list); }, 900);
}
function optAsk(list, manual){
  const mm = upModal(), d = $('#dlgUp'); opt.pending = list;
  d.innerHTML = `<h2>⚡ Optimize for smooth editing?</h2><div class="hint" style="margin:8px 0">${list.length === 1 ? `<b style="color:var(--text)">${esc(list[0].name)}</b> (${list[0].w} × ${list[0].h})` : list.length + ' videos'} ${manual ? '' : 'is a heavy phone/camera video. These can stutter and freeze while playing and in reels.'}</div>
    <div class="hint" style="margin-bottom:10px">EasyCut makes a smooth editing copy: 1080p, 30 fps, quick to jump around in, and iPhone HDR turned into normal colors. Your original file is not changed. Exports will be 1080p.</div>
    ${manual ? '' : `<label class="chk"><input type="checkbox" id="optAlways"> Always do this for heavy videos</label>`}
    <div class="row"><button class="btn" data-o="no">${manual ? 'Cancel' : 'Keep original'}</button><button class="btn pri" data-o="yes">⚡ Optimize</button></div>`;
  d.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
    const al = $('#optAlways'); if (al && al.checked) try { localStorage.setItem('easycut.optimize', b.dataset.o === 'yes' ? 'always' : 'never'); } catch (e) {}
    if (b.dataset.o === 'yes') runOptimize(opt.pending); else mm.classList.remove('on');
  });
  mm.classList.add('on');
}
async function runOptimize(list){
  const mm = upModal(), d = $('#dlgUp'); mm.classList.add('on'); let done = 0;
  for (const [i, m] of list.entries()){
    const show = p => { d.innerHTML = `<h2>⚡ Optimizing ${list.length > 1 ? `${i + 1} of ${list.length}` : ''}</h2><div class="hint">${esc(m.name)}</div><div class="bar" style="margin:12px 0 6px"><i style="width:${(p.pct || 0).toFixed(1)}%"></i></div><div class="crow"><span class="hint">${esc(p.msg || '')}</span><b>${Math.round(p.pct || 0)}%</b></div><div class="row"><button class="btn" data-u="cancel">Cancel</button></div>`; };
    show({ pct:0, msg:'Starting…' }); const off = UPB.onProgress(show);
    let r; try { const o = { name:m.name }; if (m.path) o.input = m.path; else o.data = await (await fetch(m.url)).arrayBuffer(); r = await UPB.optimize(o); } catch (e) { r = { ok:false, error:e.message }; }
    off();
    if (!r.ok){ if (r.cancelled) break; toast('Could not optimize ' + m.name + ': ' + r.error, 5000); continue; }
    const buf = await DESK.readFile(r.path), nm = await importOne(new File([buf], m.name.replace(/\.[^.]+$/, '') + ' (edit).mp4', { type:'video/mp4' }), uid(), r.path);
    if (!nm) continue; nm.optimized = true;
    let n = 0; for (const c of S.clips) if (c.mediaId === m.id){ c.mediaId = nm.id; n++; }
    for (const o of S.overlays) if (o.mediaId === m.id) o.mediaId = nm.id;
    for (const it of reel.items) if (it.mid === m.id) it.mid = nm.id;
    if (reel.music === m.id) reel.music = nm.id;
    m.replacedBy = nm.id; done++;
  }
  mm.classList.remove('on'); refreshAll(); seekPreview(); renderPanel(); if (studio().classList.contains('on')) renderStudio();
  if (done) toast(`⚡ ${done} video${done === 1 ? '' : 's'} optimized — playback and reels will be smooth now`, 4500);
}
