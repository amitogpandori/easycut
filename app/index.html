<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyCut — Video Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;800&family=Anton&family=Bebas+Neue&family=Montserrat:wght@500;800&family=Pacifico&family=Permanent+Marker&family=Noto+Sans+Devanagari:wght@500;800&family=Noto+Sans+Gurmukhi:wght@500;800&family=Oswald:wght@500;700&family=Raleway:wght@500;800&family=Playfair+Display:wght@600;800&family=Lobster&family=Dancing+Script:wght@600;700&family=Caveat:wght@600;700&family=Righteous&family=Bangers&family=Satisfy&family=Kaushan+Script&family=Russo+One&family=Archivo+Black&family=Teko:wght@500;700&family=Rajdhani:wght@600;700&family=Abril+Fatface&family=Bungee&family=Shrikhand&family=Monoton&family=Baloo+2:wght@600;800&family=Mukta:wght@500;800&family=Yatra+One&family=Rozha+One&family=Baloo+Paaji+2:wght@600;800&family=Mukta+Mahee:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e13;--panel:#141720;--panel2:#1b1f2b;--panel3:#232838;--line:#262b3a;
  --text:#eceef5;--mut:#8b91a7;--dim:#5d6378;
  --acc:#ff4d6d;--acc2:#ff8a5c;--vid:#3b82f6;--txt:#a855f7;--aud:#10b981;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{display:grid;grid-template-rows:54px minmax(0,1fr) 270px;grid-template-columns:minmax(0,1fr);height:100vh;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.3px}
.logo .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px #ff4d6d55}
.pname{background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 9px;width:220px;color:var(--text)}
.pname:hover{border-color:var(--line)}.pname:focus{outline:none;border-color:var(--acc);background:var(--panel2)}
.sp{flex:1}
.ib{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--mut)}
.ib:hover:not(:disabled){background:var(--panel3);color:var(--text)}
.ib:disabled{opacity:.35;cursor:default}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:9px;background:var(--panel3);font-weight:600}
.btn:hover{filter:brightness(1.15)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 18px #ff4d6d44}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.full{width:100%;justify-content:center}
.btn.danger{color:#ff7b8f}

/* workspace */
.ws{display:grid;grid-template-columns:68px 270px minmax(0,1fr) 300px;min-height:0}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:8px 6px;overflow-y:auto;min-height:0;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0;border-radius:10px;color:var(--mut);font-size:11px;font-weight:600}
.tab svg.i{width:20px;height:20px}
.tab:hover{color:var(--text);background:var(--panel2)}
.tab.on{color:#fff;background:var(--panel3)}
.tab.on svg{color:var(--acc)}
.panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px}
.panel h3,.props h3{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--mut)}
.hint{color:var(--mut);font-size:12.5px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--mut);font-size:12.5px;margin-bottom:12px;cursor:pointer}
.drop:hover{border-color:var(--acc);color:var(--text)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{position:relative;border-radius:10px;overflow:hidden;background:var(--panel2);cursor:pointer;border:1px solid transparent}
.mcard:hover{border-color:var(--acc)}
.mthumb{aspect-ratio:16/10;background:#0a0b0f center/cover no-repeat;display:grid;place-items:center;color:var(--mut)}
.mthumb.aud{background-size:100% 60%;background-color:#0d1a16}
.badge{position:absolute;top:6px;right:6px;background:#000a;padding:1px 6px;border-radius:6px;font-size:11px;font-weight:600}
.tbadge{position:absolute;top:6px;left:6px;background:#000a;padding:1px 6px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase}
.mname{padding:6px 8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.mcard .add{position:absolute;bottom:30px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;opacity:0;transition:.15s}
.mcard:hover .add{opacity:1}
.loading{opacity:.6;pointer-events:none}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preset{background:var(--panel2);border-radius:10px;padding:14px 6px;text-align:center;font-size:17px;line-height:1.15;border:1px solid transparent;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.preset:hover{border-color:var(--acc)}
.egrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.emo{font-size:26px;padding:6px 0;border-radius:8px}
.emo:hover{background:var(--panel3)}
.fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fcard{border-radius:9px;overflow:hidden;background:var(--panel2);border:2px solid transparent;font-size:11px;font-weight:600}
.fcard.on{border-color:var(--acc)}
.fcard div{aspect-ratio:1;background:#222 center/cover}
.fcard span{display:block;padding:4px 0}
.acards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acard{background:var(--panel2);border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;border:2px solid transparent;font-size:12px;font-weight:600}
.acard.on{border-color:var(--acc)}
.acard i{display:block;border:2px solid var(--mut);border-radius:4px}
.acard small{color:var(--mut);font-weight:500}
.sec{margin-bottom:20px}
.vo{display:flex;align-items:center;gap:10px;background:var(--panel2);padding:12px;border-radius:12px}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--acc);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* stage */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;background:radial-gradient(ellipse at center,#161a25 0%,var(--bg) 70%)}
.pv{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px;position:relative}
#cv{position:absolute;background:#000;border-radius:6px;box-shadow:0 10px 40px #0008;touch-action:none}
.empty{position:absolute;inset:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border:2px dashed #2c3245;border-radius:18px;text-align:center;padding:20px;background:#0c0e13cc}
.empty b{font-size:20px}
.empty .hint{max-width:380px}
.transport{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px 12px}
.tc{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mut);min-width:130px}
.tc b{color:var(--text);font-weight:600}
.play{width:46px;height:46px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.play:hover{transform:scale(1.05)}
.play svg.i{width:20px;height:20px}

/* props */
.props{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.phead .dot{width:10px;height:10px;border-radius:3px}
.phead .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.phead small{color:var(--mut)}
.prow{margin-bottom:14px}
.prow>label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:6px}
.rng{display:flex;align-items:center;gap:10px}
.rng input{flex:1}
.rv{min-width:44px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:var(--text)}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:var(--panel3);border-radius:4px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--acc);cursor:pointer}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel2);padding:3px;border-radius:9px}
.seg button{flex:1;padding:6px 6px;border-radius:7px;font-size:12px;font-weight:600;color:var(--mut);white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel3);color:#fff;box-shadow:inset 0 0 0 1px var(--acc)}
.inp,select.inp,textarea.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea.inp{resize:vertical;min-height:64px;user-select:text}
.inp:focus{outline:none;border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0}
.chk input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}
input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:2px;cursor:pointer}
.crow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.acts{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;color:var(--mut)}
.keys kbd{background:var(--panel3);border-radius:5px;padding:1px 7px;color:var(--text);font:600 11.5px "Plus Jakarta Sans";justify-self:start}
.flash{animation:fl 1s}
@keyframes fl{0%,60%{background:#ff4d6d22}}

/* timeline */
.tl{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tlbar{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line)}
.tlbar .btn.sm{background:transparent;color:var(--mut)}
.tlbar .btn.sm:hover{background:var(--panel3);color:var(--text)}
.zoom{display:flex;align-items:center;gap:6px;color:var(--mut)}
.zoom input{width:120px}
.tlbody{flex:1;display:flex;min-height:0;overflow:hidden}
.tllabels{width:86px;flex:none;border-right:1px solid var(--line);padding-top:26px;padding-bottom:40px;overflow:hidden}
.tll{display:flex;align-items:center;gap:6px;padding:0 10px;font-size:11.5px;font-weight:700;color:var(--mut);border-bottom:1px solid #1d2130}
.tll i{width:8px;height:8px;border-radius:2px}
.tlscroll{flex:1;overflow:auto;position:relative}
.tlinner{position:relative;min-height:100%}
.ruler{height:26px;position:relative;border-bottom:1px solid var(--line);cursor:ew-resize;background:var(--panel)}
.tick{position:absolute;top:0;height:100%;border-left:1px solid #2e3446}
.tick span{position:absolute;left:4px;top:5px;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.tick.mn{height:6px;top:auto;bottom:0}
.track{position:relative;border-bottom:1px solid #1d2130}
.item{position:absolute;top:5px;border-radius:7px;overflow:hidden;cursor:grab;touch-action:none;border:2px solid transparent}
.item.sel{border-color:#fff;box-shadow:0 0 0 3px #ff4d6d88;z-index:6}
.item .lbl{position:absolute;left:6px;top:4px;right:6px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000;pointer-events:none}
.item .lbl b{background:var(--acc);border-radius:4px;padding:0 4px;margin-right:4px;text-shadow:none}
.vclip{height:54px;background:#20283a repeat-x left center/auto 100%}
.vclip::after{content:"";position:absolute;inset:0;background:linear-gradient(#0006,transparent 45%);pointer-events:none}
.titem{height:24px;background:linear-gradient(135deg,#7c3aed,#a855f7)}
.titem .lbl{top:3px}
.aitem{height:30px;background:#0f3b2f no-repeat;background-color:#0e3a2e}
.oitem{height:30px;background:#5a2a08 repeat-x left center/auto 100%}
.oitem::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#f97316cc,#f9731640);pointer-events:none}
.oitem .lbl{top:7px;z-index:1}
.desk{display:none!important}
body.is-desk .desk{display:inline-flex!important}
.cropbar{display:flex;gap:6px;margin-top:12px}
.cropbar .btn{flex:1;justify-content:center}
.ovlist{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.busy{position:fixed;inset:0;background:#000a;z-index:95;display:none;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.busy.on{display:flex}
.aitem .lbl{top:7px}
.h{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize;z-index:2}
.h-l{left:0}.h-r{right:0}
.item.sel .h{background:#fff}
.item.sel .h::after{content:"";position:absolute;left:4px;top:35%;height:30%;width:2px;background:#000;border-radius:2px}
.item.dragging{opacity:.75;z-index:5;cursor:grabbing}
.junc{position:absolute;top:21px;width:22px;height:22px;margin-left:-11px;border-radius:6px;background:var(--panel3);border:1px solid #3a4157;color:var(--mut);font-size:12px;font-weight:800;z-index:4;display:grid;place-items:center;padding:0}
.junc:hover,.junc.has{background:#fff;color:var(--acc)}
.temp{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:12px;pointer-events:none}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;z-index:8}
.playhead::before{content:"";position:absolute;top:0;left:-7px;width:16px;height:14px;background:#fff;clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}
.ins{position:absolute;top:2px;width:3px;height:58px;background:var(--acc);border-radius:2px;z-index:9;pointer-events:none;box-shadow:0 0 10px var(--acc)}

/* overlays */
.toast{position:fixed;left:50%;bottom:290px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
.modal.on{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:440px;max-width:100%;box-shadow:0 30px 80px #000a}
.dlg h2{margin:0 0 4px;font-size:19px}
.dlg .hint{margin-bottom:16px}
.bar{height:8px;background:var(--panel3);border-radius:8px;overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .2s}
.dlg video{width:100%;border-radius:10px;background:#000;max-height:260px;margin:8px 0 12px}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;margin:12px 0}
.kv span:nth-child(odd){color:var(--mut)}
.dz{position:fixed;inset:0;background:#ff4d6d22;border:3px dashed var(--acc);z-index:80;display:none;align-items:center;justify-content:center;font-size:22px;font-weight:800;pointer-events:none}
.dz.on{display:flex}
#pool{position:fixed;left:0;top:0;width:2px;height:2px;overflow:hidden;opacity:0;pointer-events:none}

@media (max-height:820px){
  body{grid-template-rows:50px minmax(0,1fr) 230px}
  .rail{gap:2px;padding:6px 5px}
  .tab{padding:5px 0;gap:2px;font-size:10px}
  .tab svg.i{width:18px;height:18px}
  .transport{padding:4px 12px 8px}
  .play{width:40px;height:40px}
  .pv{padding:10px}
}
@media (max-height:640px){ body{grid-template-rows:48px minmax(0,1fr) 200px} .tab svg.i{width:16px;height:16px} }
@media (max-width:1100px){.ws{grid-template-columns:62px 230px minmax(0,1fr) 260px}}
@media (max-width:860px){
  body{display:block;height:auto;overflow:auto}
  .ws{display:flex;flex-direction:column}
  .stage{order:1;height:56vh}
  .rail{order:2;flex-direction:row;overflow-x:auto;border:0;border-bottom:1px solid var(--line)}
  .tab{flex:1;min-width:58px}
  .panel{order:3;max-height:300px;border:0}
  .props{order:4;border:0;border-top:1px solid var(--line)}
  .tl{height:260px}
  .pname{width:120px}
  .toast{bottom:20px}
  body{overflow-x:hidden}
  .top{gap:4px;padding:0 8px}
  .logo{font-size:0}.logo .mk{font-size:14px}
  .transport{flex-wrap:wrap}
  .tc{min-width:0;width:100%;text-align:center}
  .transport>div:last-child{min-width:0!important}
  .tlbar{flex-wrap:wrap}
  .zoom input{width:70px}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><div class="mk"><svg class="i f" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>EasyCut</div>
  <input class="pname" id="pname" value="My Vlog" spellcheck="false" aria-label="Project name">
  <div class="sp"></div>
  <button class="btn sm" id="bReel" title="Make a reel automatically from your clips" style="background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff">✨ Auto Reel</button>
  <button class="btn sm desk" id="bOpen" title="Open project (Ctrl+O)">Open</button>
  <button class="btn sm desk" id="bSave" title="Save project (Ctrl+S)">Save</button>
  <button class="ib" id="bUndo" title="Undo (Ctrl+Z)" disabled></button>
  <button class="ib" id="bRedo" title="Redo (Ctrl+Y)" disabled></button>
  <button class="btn pri" id="bExport"></button>
</header>

<div class="ws">
  <nav class="rail" id="rail"></nav>
  <aside class="panel" id="panel"></aside>
  <section class="stage">
    <div class="pv" id="pv">
      <canvas id="cv" width="1920" height="1080"></canvas>
      <div class="empty" id="empty">
        <div class="logo"><div class="mk" style="width:54px;height:54px;border-radius:16px"><svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg></div></div>
        <b>Start your video</b>
        <div class="hint">Drag videos, photos and music anywhere on this window, or import them. They go straight onto the timeline in order.</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn pri" id="bImportBig">Import media</button><button class="btn" id="bReelBig" style="background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff">✨ Make an Auto Reel</button></div>
      </div>
    </div>
    <div class="transport">
      <div class="tc" id="tc"><b>0:00.0</b> / 0:00.0</div>
      <button class="ib" id="bStart" title="Go to start (Home)"></button>
      <button class="ib" id="bBack" title="Previous frame (←)"></button>
      <button class="play" id="bPlay" title="Play / Pause (Space)"></button>
      <button class="ib" id="bFwd" title="Next frame (→)"></button>
      <button class="ib" id="bEnd" title="Go to end (End)"></button>
      <div style="min-width:130px;display:flex;justify-content:flex-end;gap:6px"><button class="btn sm" id="bShot" title="Save this frame as an image (thumbnail)"></button><button class="btn sm" id="bSplit2" title="Split at playhead (S)"></button></div>
    </div>
  </section>
  <aside class="props" id="props"></aside>
</div>

<section class="tl">
  <div class="tlbar">
    <button class="btn sm" id="tSplit" title="Split (S)"></button>
    <button class="btn sm" id="tDup" title="Duplicate (Ctrl+D)"></button>
    <button class="btn sm" id="tDel" title="Delete (Del)"></button>
    <div class="sp"></div>
    <div class="zoom">
      <button class="ib" id="zOut" title="Zoom out (-)"></button>
      <input type="range" id="zoom" min="0" max="100" value="40" aria-label="Timeline zoom">
      <button class="ib" id="zIn" title="Zoom in (+)"></button>
      <button class="btn sm" id="zFit">Fit</button>
    </div>
  </div>

/* ---------- import ---------- */
function once(el, ev, ms = 15000){
  return new Promise((res, rej) => {
    const ok = () => { cl(); res(); }, bad = () => { cl(); rej(new Error(ev)); };
    const to = setTimeout(bad, ms);
    const cl = () => { clearTimeout(to); el.removeEventListener(ev, ok); el.removeEventListener('error', bad); };
    el.addEventListener(ev, ok, { once:true }); el.addEventListener('error', bad, { once:true });
  });
}
function kindOf(f){
  if (f.type.startsWith('video')) return 'video'; if (f.type.startsWith('image')) return 'image'; if (f.type.startsWith('audio')) return 'audio';
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  if (['mp4','mov','webm','mkv','m4v','avi'].includes(ext)) return 'video';
  if (['jpg','jpeg','png','gif','webp','bmp','heic'].includes(ext)) return 'image';
  if (['mp3','wav','m4a','aac','ogg','opus','flac'].includes(ext)) return 'audio';
  return null;
}
async function videoThumb(url, t){
  const v = document.createElement('video'); v.muted = true; v.preload = 'auto'; v.src = url; pool.appendChild(v);
  try { await once(v, 'loadeddata'); v.currentTime = t; await once(v, 'seeked'); const w = 240, h = Math.max(1, Math.round(w * v.videoHeight / v.videoWidth)) || 135; const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(v, 0, 0, w, h); return c.toDataURL('image/jpeg', .72); }
  catch (e) { return ''; } finally { v.removeAttribute('src'); v.load(); v.remove(); }
}
async function loadMedia(m, file){
  if (m.type === 'video'){
    const v = document.createElement('video'); v.preload = 'auto'; v.playsInline = true; v.src = m.url; pool.appendChild(v);
    await once(v, 'loadedmetadata');
    m.w = v.videoWidth; m.h = v.videoHeight; m.duration = v.duration;
    if (!isFinite(m.duration)){ v.currentTime = 1e9; await once(v, 'seeked').catch(() => {}); m.duration = isFinite(v.duration) ? v.duration : 10; v.currentTime = 0; }
    if (!m.w) throw new Error('no video track');
    v.addEventListener('seeked', () => { if (!playing) scheduleRender(); });
    v.addEventListener('loadeddata', () => scheduleRender());
    m.el = v; m.thumb = await videoThumb(m.url, Math.min(1, m.duration / 3));
  } else if (m.type === 'image'){
    const img = new Image(); img.src = m.url; await img.decode(); m.w = img.naturalWidth; m.h = img.naturalHeight; m.el = img; m.thumb = m.url;
  } else {
    const buf = await file.arrayBuffer();
    const AC0 = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const ab = await new AC0(1, 2, 44100).decodeAudioData(buf);
    m.duration = ab.duration; m.wave = waveImg(ab);
  }
}
function waveImg(ab){
  const W = 800, Hh = 60, data = ab.getChannelData(0), step = Math.max(1, Math.floor(data.length / W));
  const c = document.createElement('canvas'); c.width = W; c.height = Hh; const g = c.getContext('2d'); g.fillStyle = '#34d399';
  for (let x = 0; x < W; x++){ let mx = 0; const o = x * step; for (let i = 0; i < step; i += 8){ const v = Math.abs(data[o + i] || 0); if (v > mx) mx = v; } const h = Math.max(1, mx * Hh * .95); g.fillRect(x, (Hh - h) / 2, 1, h); }
  return c.toDataURL('image/png');
}
async function importOne(f, forceId, forcePath){
  const type = kindOf(f); if (!type){ toast(`Skipped ${f.name} — not a video, photo or audio file`); return null; }
  let path = forcePath || ''; if (!path && DESK && DESK.pathForFile){ try { path = DESK.pathForFile(f) || ''; } catch (e) {} }
  const m = { id:forceId || uid(), type, name:f.name, url:URL.createObjectURL(f), duration:0, w:0, h:0, el:null, thumb:'', wave:'', loading:true, path };
  media[m.id] = m; renderPanel();
  try { await loadMedia(m, f); m.loading = false; renderPanel(); return m; }
  catch (e) { delete media[m.id]; URL.revokeObjectURL(m.url); renderPanel(); toast(`Couldn't open ${f.name}. Try MP4 (H.264), MOV, JPG, PNG or MP3.`, 4000); return null; }
}
async function importFiles(files, opt = {}){
  const list = [...files]; if (!list.length) return;
  const wasEmpty = !S.clips.length;
  const firstVis = list.find(f => kindOf(f) && kindOf(f) !== 'audio');
  if (firstVis && tab !== 'media' && !opt.audioOnly){ tab = 'media'; renderRail(); renderPanel(); }
  let at = opt.at;
  if (opt.add !== false) push();
  for (const f of list){
    const m = await importOne(f); if (!m) continue;
    if (opt.add !== false){
      if (m.type === 'audio') addAudio(m.id, at != null ? at : (opt.audioAt != null ? opt.audioAt : playT));
      else { addToTimeline(m.id, at, true); if (at != null) at = null; }
    }
  }
  if (wasEmpty && S.clips.length){ playT = 0; fitZoom(); }
  refreshAll();
}

/* ---------- adding things ---------- */
function newClip(mid){ const m = media[mid]; return { id:uid(), mediaId:mid, in:0, out:m.type === 'video' ? m.duration : 3, speed:1, volume:1, filter:'none', b:100, c:100, s:100, fit:'auto', rotate:0, flipH:false, trans:'none', motion:m.type === 'image' ? 'in' : 'none', crop:{ ...FULL }, logos:[], vig:0, afIn:0, afOut:0, aeff:'none' }; }
function newOverlay(mid, extra = {}){
  const m = media[mid];
  const o = { id:uid(), mediaId:mid, start:playT, dur:m.type === 'video' ? m.duration : 3, offset:0, x:.74, y:.28, scale:.36, opacity:1, rotate:0, flipH:false, shape:'round', border:true, borderColor:'#ffffff', shadow:true, anim:'pop', chroma:false, keyColor:'#00ff00', keyTol:.35, volume:m.type === 'video' ? 1 : 0, cell:null, ...extra };
  return o;
}
function addOverlay(mid, extra){
  const m = media[mid]; if (!m || m.type === 'audio') return;
  push(); const o = newOverlay(mid, extra);
  const end = totalDur(); if (end > 0 && o.start >= end - .05) o.start = Math.max(0, end - Math.min(o.dur, 3));
  S.overlays.push(o); sel = { type:'overlay', id:o.id };
  playT = o.start + Math.min(.4, o.dur / 2);
  refreshAll(); seekPreview();
}
function insertIndexAt(t){ if (t == null){ const ca = clipAt(playT); if (!ca || playT >= videoEnd() - 1e-3) return S.clips.length; return ca.i + 1; } const st = clipStarts(); let i = 0; for (; i < S.clips.length; i++) if (t < st[i] + clipLen(S.clips[i]) / 2) break; return i; }
function addToTimeline(mid, t, noHistory){
  const m = media[mid]; if (!m) return;
  if (m.type === 'audio') return addAudio(mid, t != null ? t : playT);
  if (!noHistory) push();
  const c = newClip(mid), idx = insertIndexAt(t);
  S.clips.splice(idx, 0, c);
  playT = clipStarts()[idx]; sel = { type:'clip', id:c.id };
  refreshAll(); seekPreview();
}
function addAudio(mid, start, extra = {}){ const m = media[mid]; push(); const a = { id:uid(), mediaId:mid, start:Math.max(0, start || 0), offset:0, dur:m.duration, volume:1, fadeIn:0, fadeOut:0, duck:false, aeff:'none', voice:/^Voiceover/.test(m.name), ...extra }; S.audios.push(a); sel = { type:'audio', id:a.id }; refreshAll(); }
function addText(p){
  push(); const x = { ...TEXT_BASE, ...p, id:uid(), start:playT };
  const end = totalDur(); if (end > 0 && x.start >= end - .05) x.start = Math.max(0, end - x.dur);
  S.texts.push(x); sel = { type:'text', id:x.id };
  document.fonts?.load(`${x.bold ? 800 : 500} 40px "${x.font}"`).then(scheduleRender).catch(() => {});
  playT = x.start + Math.min(.4, x.dur / 2);
  refreshAll(); seekPreview();
}

let pendingLayout = null;
function startLayout(id){ pendingLayout = LAYOUTS.find(l => l.id === id); const L = pendingLayout; toast(`Choose ${L.n} videos or photos for “${L.name}”`, 3500); $('#fileLayout').click(); }
async function buildLayout(files){
  const L = pendingLayout; pendingLayout = null; if (!L) return;
  const ms = [];
  for (const f of files){ const m = await importOne(f); if (m && m.type !== 'audio') ms.push(m); }
  if (!ms.length) return;
  while (ms.length < L.n) ms.push(ms[ms.length % Math.max(1, ms.length)]);
  push();
  const durOf = m => m.type === 'video' ? m.duration : 5;
  if (L.pip){
    const main = ms[0], idx = S.clips.length, start = videoEnd();
    const c = newClip(main.id); S.clips.push(c);
    const dur = Math.min(clipLen(c), durOf(ms[1]));
    const o = newOverlay(ms[1].id, L.pip === 'circle'
      ? { start, dur, x:.2, y:.72, scale:.3, shape:'circle', anim:'pop', volume:ms[1].type === 'video' ? 1 : 0 }

    S.overlays.push(o); sel = { type:'overlay', id:o.id }; playT = clipStarts()[idx] + .01;
  } else {
    const start = videoEnd(), dur = Math.max(...ms.slice(0, L.n).map(durOf));

      const m = ms[i]; const o = newOverlay(m.id, { start, dur:Math.min(dur, durOf(m)), cell:{ x:cl[0], y:cl[1], w:cl[2], h:cl[3] }, shape:'round', border:false, shadow:false, anim:'fade', volume:i === 0 && m.type === 'video' ? 1 : 0 });
      S.overlays.push(o); if (i === 0) sel = { type:'overlay', id:o.id };
    });

  }

}

let pdrag = null;

cv.addEventListener('pointerdown', e => {
  const [px, py] = cvPoint(e);

      const mode = boxHit(px, py, c.crop || FULL, cropMode.ratio === 'free'); if (!mode) return;

    } else {

      if (idx < 0) for (let i = L.length - 1; i >= 0; i--){ mode = boxHit(px, py, L[i], true); if (mode){ idx = i; break; } }
      if (idx < 0) return;

    const o = getObj('overlay', ovHandle.id);

  }
  for (let i = ovBoxes.length - 1; i >= 0; i--){
    const b = ovBoxes[i];

      if (playing) pause(); setSel('overlay', b.id);

});
cv.addEventListener('pointermove', e => {
  if (!pdrag) return; const [px, py] = cvPoint(e);
  if (pdrag.kind === 'crop' || pdrag.kind === 'logo'){
    const c = getObj('clip', cropMode && cropMode.clipId); if (!c) return;
    if (!pdrag.moved){ if (Math.hypot(px - pdrag.sx, py - pdrag.sy) < 3) return; push(); pdrag.moved = true; }
    const du = (px - pdrag.sx) / cropView.dw, dv = (py - pdrag.sy) / cropView.dh;

function updateTimeUI(follow){

let drag = null;
const hasOffset = (type, o) => type === 'audio' || (type === 'overlay' && media[o.mediaId] && media[o.mediaId].type === 'video');
function snapTime(t, excludeId){
  const thr = 8 / pps; const pts = [0, playT]; let s = 0; for (const c of S.clips){ s += clipLen(c); pts.push(s); }
  for (const o of [...S.texts, ...S.audios, ...S.overlays]) if (o.id !== excludeId){ pts.push(o.start, o.start + o.dur); }
  let best = null, bd = thr; for (const p of pts){ const d = Math.abs(p - t); if (d < bd){ bd = d; best = p; } } return best;
}
tlInner.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const j = e.target.closest('[data-junc]');
  if (j){ setSel('clip', j.dataset.junc); const s = $('#secTrans'); if (s){ s.scrollIntoView({ block:'center', behavior:'smooth' }); s.classList.remove('flash'); void s.offsetWidth; s.classList.add('flash'); } return; }
  const it = e.target.closest('.item'), x = e.clientX;
  if (it){
    const type = it.dataset.type, id = it.dataset.id, o = getObj(type, id); if (!o) return;
    const edge = e.target.classList.contains('h-l') ? 'l' : e.target.classList.contains('h-r') ? 'r' : null;
    if (!sel || sel.id !== id) setSel(type, id);
    drag = { mode:edge ? 'trim' : 'move', edge, type, id, x0:x, moved:false, orig:{ ...o }, el:tlInner.querySelector(`.item[data-id="${id}"]`) };
  } else {
    if (playing) pause(); if (cropMode){ cropMode = null; renderProps(); } playT = clamp(xToTime(x), 0, totalDur()); seekPreview();

});
tlInner.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.mode === 'scrub'){ playT = clamp(xToTime(e.clientX), 0, totalDur()); seekPreview(); return; }
  const dx = e.clientX - drag.x0; if (!drag.moved){ if (Math.abs(dx) < 4) return; drag.moved = true; push(); if (playing) pause(); }
  const o = getObj(drag.type, drag.id); if (!o) return; const d = dx / pps, g = drag.orig;
  if (drag.type === 'clip'){
    const m = media[o.mediaId], idx = S.clips.indexOf(o);
    if (drag.mode === 'trim'){
      if (drag.edge === 'r'){
        const L = Math.max(.1, clipLen(g) + d); o.out = g.in + L * o.speed; if (m.type === 'video') o.out = Math.min(o.out, m.duration);
        playT = clipStarts()[idx] + clipLen(o) - .02;
      } else {

      let acc = 0, ti = 0; for (; ti < others.length; ti++){ const L = clipLen(others[ti]); if (center < acc + L / 2) break; acc += L; }

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  const tg = e.target; if (tg.matches && tg.matches('input,textarea,select') && !(tg.type === 'range')) return;
  const k = e.key, mod = e.ctrlKey || e.metaKey;
  if (k === ' '){ e.preventDefault(); togglePlay(); }
  else if (mod && k.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && k.toLowerCase() === 'y'){ e.preventDefault(); redo(); }
  else if (mod && k.toLowerCase() === 'd'){ e.preventDefault(); dup(); }
  else if (mod && k.toLowerCase() === 's'){ e.preventDefault(); saveProject(); }
  else if (mod && k.toLowerCase() === 'o'){ e.preventDefault(); openProject(); }
  else if (mod) return;
  else if ((k === 's' || k === 'S') && !cropMode) split();
  else if (k === 'Delete' || k === 'Backspace'){ e.preventDefault(); del(); }
  else if (k === 'ArrowLeft'){ e.preventDefault(); step(e.shiftKey ? -1 : -1 / 30); }
  else if (k === 'ArrowRight'){ e.preventDefault(); step(e.shiftKey ? 1 : 1 / 30); }
  else if (k === 'Home'){ pause(); playT = 0; seekPreview(); scrollToPlayhead(); }
  else if (k === 'End'){ pause(); playT = totalDur(); seekPreview(); scrollToPlayhead(); }
  else if (k === '+' || k === '='){ setPps(pps * 1.4); }
  else if (k === '-'){ setPps(pps / 1.4); }
  else if (k === 'Escape'){ if (cropMode) exitBoxMode(); else setSel(null); }
});

/* ---------- voiceover ---------- */
let voTimer = null;
async function toggleVoice(){
  if (voice){ try { voice.rec.stop(); } catch (e) {} return; }
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast('Voice recording is not supported in this browser');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } }); }
  catch (e) { return toast('Microphone is blocked here. Open EasyCut directly in Chrome or Edge (e.g. your deployed link) and allow the mic.', 5000); }
  const mt = ['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  const rec = new MediaRecorder(stream, mt ? { mimeType:mt } : undefined), chunks = [], at = playT;
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop()); clearInterval(voTimer); voice = null; pause(); renderPanel();
    const type = rec.mimeType || 'audio/webm'; const f = new File([new Blob(chunks, { type })], `Voiceover ${++voN}.${type.includes('mp4') ? 'm4a' : 'webm'}`, { type });
    const m = await importOne(f); if (m){ addAudio(m.id, at); toast('Voiceover added to the audio track'); }
  };
  voice = { rec, t0:performance.now() }; rec.start(250); renderPanel();
  voTimer = setInterval(() => { const el = $('#voT'); if (el && voice) el.textContent = fmt((performance.now() - voice.t0) / 1000); }, 200);
  if (S.clips.length) play();
  toast('Recording — tip: use headphones so the video sound isn’t picked up');
}

/* ---------- export ---------- */
const MIMES = ['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1.4d0028,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
const pickMime = () => window.MediaRecorder ? (MIMES.find(t => MediaRecorder.isTypeSupported(t)) || '') : null;
const dlg = $('#dlgExport');
function openExport(){

  if (playing) pause();

  if (mime === null || !cv.captureStream){ dlg.innerHTML = `<h2>Export not supported</h2><div class="hint">This browser can't record video. Please use Chrome or Edge on your PC.</div><div class="row"><button class="btn" data-x="close">Close</button></div>`; }

    <div class="kv"><span>Size</span><span>${w} × ${h} (${S.res}p, ${S.aspect})</span><span>Length</span><span>${fmt(T)}</span><span>Format</span><span>${mime.startsWith('video/mp4') ? 'MP4' : 'WebM'} · ${S.fps || 30} fps</span><span>Time needed</span><span>about ${fmt(T)} (plays through once)</span></div>

async function primeFrame(){

  if (ca){ const m = media[ca.c.mediaId]; if (m && m.type === 'video'){ m.el.currentTime = ca.c.in; await once(m.el, 'seeked', 3000).catch(() => {}); } }
  renderFrame();
}
async function startExport(){
  const mime = pickMime(); ensureAudio(); if (AC && AC.state === 'suspended') await AC.resume().catch(() => {});

  if (recDest) tracks.push(...recDest.stream.getAudioTracks());
  let rec;

async function detectBeat(m){
  const buf = await (await fetch(m.url)).arrayBuffer();
  const ab = await new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 2, 44100).decodeAudioData(buf);
  const d = ab.getChannelData(0), sr = ab.sampleRate, hop = Math.round(sr * .01), n = Math.floor(Math.min(d.length, sr * 90) / hop);
  const env = new Float32Array(n); let prev = 0;
  for (let i = 0; i < n; i++){ let e = 0; const o = i * hop; for (let j = 0; j < hop; j += 2){ const v = d[o + j]; e += v * v; } e = Math.sqrt(e / hop * 2); env[i] = Math.max(0, e - prev); prev = e; }
  let best = 50, bv = -1;
  for (let lag = 33; lag <= 100; lag++){ let s = 0; for (let i = 0; i + lag < n; i++) s += env[i] * env[i + lag]; s /= Math.max(1, n - lag); const bpm = 6000 / lag, w = Math.exp(-Math.pow(Math.log2(bpm / 120), 2) / .5); if (s * w > bv){ bv = s * w; best = lag; } }
  let bo = 0, bs = -1; for (let o = 0; o < best; o++){ let s = 0; for (let i = o; i < n; i += best) s += env[i]; if (s > bs){ bs = s; bo = o; } }
  return { period:best / 100, offset:bo / 100, duration:ab.duration, bpm:Math.round(6000 / best) };
}
async function makeReel(){
  const style = REEL_STYLES.find(s => s.id === reel.style) || REEL_STYLES[0];

  let beat = { period:.5, offset:0, duration:Infinity, bpm:120 };
  if (mus){ try { beat = await detectBeat(mus); } catch (e) { toast('Could not read the song’s beat, using 120 BPM'); } }
  let cut = beat.period * style.beats; while (cut < .4) cut *= 2;
  const total = Math.min(reel.len, mus ? beat.duration : reel.len);
  push();
  if (playing) pause(); cropMode = null;

  S.aspect = reel.aspect; S.fit = 'fill'; S.bg = 'black'; applyCanvasSize();
  const cursor = {}; clips.forEach(m => cursor[m.id] = m.type === 'video' ? Math.min(m.duration * .15, Math.max(0, m.duration - 2)) : 0);
  const bounds = []; let t = beat.offset > .05 && beat.offset < cut ? beat.offset : 0;
  if (t > 0) bounds.push(0);

    const len = bounds[i + 1] - bounds[i]; if (len < .15) continue;

      if (need > m.duration){ c.speed = m.duration / len * .98; c.in = 0; c.out = len * c.speed; }
      else { c.speed = sp; c.in = a; c.out = a + need; }

    title:{ text:'NO EXCUSES 💪', font:'Oswald', size:130, color:'#bbf7d0', stroke:true, anim:'pop', y:.18 } },
  { id:'aesthetic', name:'Soft Aesthetic', emoji:'🌸', colors:['#fbcfe8','#c4b5fd'], beats:4, trans:['fade','blur'], filter:'fade', vig:0, motion:['in','left','right'], speeds:[.75, 1],
    title:{ text:'little moments 🌸', font:'Dancing Script', size:110, color:'#ffffff', shadow:true, anim:'fade', y:.5 } },
  { id:'food', name:'Food Reel', emoji:'🍜', colors:['#f97316','#facc15'], beats:2, trans:['zoom','slide','flash'], filter:'warm', vig:.1, motion:['in','out'], speeds:[1],
    title:{ text:'must try 🤤', font:'Shrikhand', size:120, bold:false, color:'#fff7ed', stroke:true, strokeColor:'#9a3412', anim:'pop', y:.18 } },
);

/* ---------- user storage: your fonts and your templates (kept on this computer) ---------- */
const store = {
  db:null, mem:{ fonts:[], tpl:[] },
  async open(){ if (this.db !== null) return this.db; try { this.db = await new Promise((res, rej) => { const r = indexedDB.open('easycut', 1); r.onupgradeneeded = () => { r.result.createObjectStore('fonts', { keyPath:'id' }); r.result.createObjectStore('tpl', { keyPath:'id' }); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); } catch (e) { this.db = false; } return this.db; },
  async all(name){ const db = await this.open(); if (!db) return this.mem[name].slice(); return new Promise(res => { try { const q = db.transaction(name).objectStore(name).getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); } catch (e) { res([]); } }); },
  async put(name, v){ const db = await this.open(); if (!db){ this.mem[name] = this.mem[name].filter(x => x.id !== v.id).concat(v); return; } return new Promise(res => { try { const t = db.transaction(name, 'readwrite'); t.objectStore(name).put(v); t.oncomplete = res; t.onerror = res; } catch (e) { res(); } }); },
  async del(name, id){ const db = await this.open(); if (!db){ this.mem[name] = this.mem[name].filter(x => x.id !== id); return; } return new Promise(res => { try { const t = db.transaction(name, 'readwrite'); t.objectStore(name).delete(id); t.oncomplete = res; t.onerror = res; } catch (e) { res(); } }); },
};
let myTemplates = [];
async function registerFont(name, data){ const face = new FontFace(name, data); await face.load(); document.fonts.add(face); if (!userFonts.includes(name)) userFonts.push(name); }
async function loadUserStuff(){
  for (const f of await store.all('fonts')){ try { await registerFont(f.name, f.data); } catch (e) {} }
  myTemplates = await store.all('tpl');
  if (tab === 'templates' || tab === 'text') renderPanel(); renderProps(); scheduleRender();
}
async function importFonts(files){
  let last = null;
  for (const f of files){
    const name = f.name.replace(/\.(ttf|otf|woff2?|TTF|OTF|WOFF2?)$/, '').replace(/[^\w\s-]/g, ' ').replace(/\s+/g, ' ').trim() || 'My Font';
    try { const data = await f.arrayBuffer(); await registerFont(name, data.slice(0)); await store.put('fonts', { id:name, name, data }); last = name; }
    catch (e) { toast(`Couldn't read ${f.name}. Use a .ttf, .otf or .woff2 font file.`, 4000); }
  }
  if (!last) return;
  const o = getSel(); if (o && sel.type === 'text'){ push(); o.font = last; }
  refreshAll(); toast(`Font “${last}” added — find it under “My fonts”`);
}
async function saveMyTemplate(name){
  const on = S.texts.filter(x => playT >= x.start && playT < x.start + x.dur);
  if (!on.length) return toast('Move the playhead to where your text is on screen, then save');
  const t0 = Math.min(...on.map(x => x.start));
  const tp = { id:uid(), cat:'Mine', name:(name || 'My template').slice(0, 40), texts:on.map(x => { const { id, ...rest } = x; return { ...rest, start:+(x.start - t0).toFixed(2) }; }) };
  myTemplates.push(tp); await store.put('tpl', tp); renderPanel(); toast(`Saved “${tp.name}” to My templates`);
}
async function deleteMyTemplate(id){ myTemplates = myTemplates.filter(t => t.id !== id); await store.del('tpl', id); renderPanel(); }
function exportMyTemplates(){
  if (!myTemplates.length) return toast('Save a template first');
  saveBlob(new Blob([JSON.stringify({ app:'EasyCut', kind:'templates', version:1, templates:myTemplates }, null, 1)], { type:'application/json' }), 'EasyCut templates.json');
}
async function importTemplatePack(file){
  try {
    const j = JSON.parse(await file.text()); const list = j && j.kind === 'templates' ? j.templates : null;
    if (!Array.isArray(list)) throw new Error('not a template pack');
    let n = 0; for (const t of list){ if (!t || !Array.isArray(t.texts)) continue; const tp = { id:uid(), cat:'Mine', name:String(t.name || 'Template').slice(0, 40), texts:t.texts.map(x => ({ ...x, text:String(x.text || '') })) }; myTemplates.push(tp); await store.put('tpl', tp); n++; }
    renderPanel(); toast(`${n} template${n === 1 ? '' : 's'} added to My templates`);
  } catch (e) { toast('That file is not an EasyCut template pack', 4000); }
}
$('#fileFont').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; importFonts(fs); });
$('#fileTpl').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importTemplatePack(f); });

/* ---------- glue ---------- */
function refreshAll(){
  applyCanvasSize();
  $('#empty').style.display = S.clips.length || S.texts.length || S.overlays.length || Object.keys(media).length ? 'none' : 'flex';
  renderPanel(); renderProps(); renderTimeline(); renderFrame(); updUndo();
}
$('#pname').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); e.stopPropagation(); });
window.addEventListener('resize', () => { fitCanvas(); renderTimeline(); });
if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe($('#pv'));
window.addEventListener('beforeunload', e => { if (S.clips.length || S.overlays.length){ e.preventDefault(); e.returnValue = ''; } });
if (window.claude && typeof window.claude.use === 'function'){ window.claude.use('downloads').then(d => { dlCap = d; }).catch(() => {}); }
document.fonts?.ready.then(scheduleRender);

renderRail(); applyCanvasSize(); refreshAll(); setPps(60);
loadUserStuff();
})();
</script>
